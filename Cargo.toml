[package]
name = "coopgame-demo"
version = "0.1.0"
edition = "2024"
description = "coopgame (crates.io) を WASM にしてブラウザで動かすデモ"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
coopgame = "0.1"
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
